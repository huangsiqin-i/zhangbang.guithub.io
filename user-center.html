<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户中心 - 邦典</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: #f8fafc;
    }

    .sidebar { width: 250px; min-height: 100vh; position: relative; }
    .main-content { flex: 1; min-height: 100vh; }
    .nav-item.active { background: linear-gradient(135deg, #9E2A2F, #B84A4F); color: white; }
    .nav-item:hover:not(.active) { background: #F8F4ED; }
    .panel-card {
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    .soft-input {
      border: 1px solid #cbd5e1;
      background: #fff;
      transition: all 0.2s ease;
    }
    .soft-input:focus {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="flex">
  <!-- 侧边栏 -->
  <aside class="sidebar bg-white shadow-lg hidden lg:block">
    <div class="p-6 border-b">
      <h1 class="text-xl font-bold text-red-700 flex items-center">
        <i class="fa fa-paint-brush mr-2"></i>用户中心
      </h1>
    </div>
    <nav class="p-4">
      <div class="space-y-1">
        <button class="nav-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3 active" data-tab="profile">
          <i class="fa fa-user"></i> 个人资料
        </button>
        <button class="nav-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3" data-tab="works">
          <i class="fa fa-image"></i> 我的作品
        </button>
        <button class="nav-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3" data-tab="favorites">
          <i class="fa fa-heart"></i> 我的收藏
        </button>
        <button class="nav-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3" data-tab="history">
          <i class="fa fa-history"></i> 最近浏览
        </button>
        <button class="nav-item w-full text-left px-4 py-3 rounded-lg flex items-center gap-3" data-tab="settings">
          <i class="fa fa-cog"></i> 账号设置
        </button>
      </div>
    </nav>
    <div class="absolute bottom-4 left-4 right-4">
      <button id="logoutBtn" class="w-full px-4 py-2 bg-gray-200 text-gray-600 rounded-lg hover:bg-gray-300 flex items-center justify-center gap-2">
        <i class="fa fa-sign-out"></i> 退出登录
      </button>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="main-content">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <button id="backBtn" class="flex items-center gap-1 text-gray-600 hover:text-gray-800 transition-colors">
          <i class="fa fa-arrow-left"></i>
          <span class="hidden sm:inline">返回</span>
        </button>
        <h2 id="pageTitle" class="text-xl font-bold text-gray-800">个人资料</h2>
      </div>
      <div class="flex items-center gap-4">
        <span id="currentUser" class="text-gray-600 flex items-center gap-2">
          <div id="miniAvatar" class="w-8 h-8 rounded-full bg-gradient-to-br from-red-600 to-amber-500 text-white text-sm font-bold flex items-center justify-center">用</div>
          <span id="miniUsername">用户</span>
        </span>
        <button id="logoutBtnTop" class="lg:hidden px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 flex items-center gap-2 transition-colors">
          <i class="fa fa-sign-out"></i> 退出
        </button>
      </div>
    </header>

    <!-- 未登录提示 -->
    <div id="notLogin" class="flex flex-col items-center justify-center h-full p-6">
      <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md text-center">
        <div class="w-16 h-16 mx-auto bg-gradient-to-br from-red-600 to-amber-500 rounded-full flex items-center justify-center mb-4">
          <i class="fa fa-user-circle text-white text-2xl"></i>
        </div>
        <h2 class="text-xl font-bold text-gray-800 mb-2">请先登录</h2>
        <p class="text-gray-500 mb-6">登录后可以管理个人资料、收藏和作品</p>
        <button onclick="window.location.href='index.html'" class="px-6 py-2.5 bg-gradient-to-r from-red-600 to-amber-500 text-white rounded-lg font-semibold hover:from-red-700 hover:to-amber-600">
          返回首页登录
        </button>
      </div>
    </div>

    <!-- 用户面板 -->
    <div id="centerPanel" class="hidden p-6">
      <!-- 个人资料 -->
      <div id="profile" class="tab-content active">
        <div class="grid lg:grid-cols-3 gap-6">
          <div class="lg:col-span-1 space-y-6">
            <div class="panel-card bg-white rounded-2xl p-6">
              <div class="flex items-center gap-4">
                <div id="avatar" class="w-20 h-20 rounded-full bg-gradient-to-br from-red-600 to-amber-500 text-white font-bold text-2xl flex items-center justify-center overflow-hidden">
                  <img id="avatarImage" alt="头像" class="hidden w-full h-full object-cover">
                  <span id="avatarText">用</span>
                </div>
                <div>
                  <p id="welcomeName" class="font-semibold text-lg">用户</p>
                  <p class="text-sm text-slate-500">欢迎回来</p>
                </div>
              </div>
              <div class="mt-3">
                <input id="avatarUploadInput" type="file" accept="image/*" class="hidden">
                <button id="uploadAvatarBtn" class="text-sm px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200">
                  <i class="fa fa-camera mr-1"></i> 上传头像
                </button>
              </div>
              <div class="mt-5 space-y-2 text-sm">
                <p class="flex items-center gap-2"><i class="fa fa-id-card-o text-slate-400 w-4"></i> <span id="cardUsername">-</span></p>
                <p class="flex items-center gap-2"><i class="fa fa-phone text-slate-400 w-4"></i> <span id="cardPhone">未填写手机号</span></p>
                <p class="flex items-start gap-2"><i class="fa fa-pencil text-slate-400 w-4 mt-1"></i> <span id="cardBio">这个人很酷，还没写签名。</span></p>
              </div>
            </div>
            <div class="panel-card bg-white rounded-2xl p-6">
              <h2 class="font-semibold mb-4">账号概览</h2>
              <div class="grid grid-cols-2 gap-3 text-sm">
                <div class="rounded-xl bg-slate-50 p-3">
                  <p class="text-slate-500">身份类型</p>
                  <p id="cardType" class="font-semibold mt-1">普通用户</p>
                </div>
                <div class="rounded-xl bg-slate-50 p-3">
                  <p class="text-slate-500">资料完整度</p>
                  <p id="profileRate" class="font-semibold mt-1">0%</p>
                </div>
                <div class="rounded-xl bg-slate-50 p-3 col-span-2">
                  <p class="text-slate-500">账号创建时间</p>
                  <p id="createdAt" class="font-semibold mt-1">-</p>
                </div>
              </div>
            </div>
          </div>
          <div class="lg:col-span-2 space-y-6">
            <div class="panel-card bg-white rounded-2xl p-6 md:p-8">
              <h2 class="text-xl font-semibold mb-4">基础资料</h2>
              <div class="grid md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-sm text-slate-600 mb-1">用户名</label>
                  <input id="usernameInput" type="text" class="soft-input w-full px-4 py-2 rounded-lg focus:outline-none">
                </div>
                <div>
                  <label class="block text-sm text-slate-600 mb-1">手机号</label>
                  <input id="phoneInput" type="tel" class="soft-input w-full px-4 py-2 rounded-lg focus:outline-none" placeholder="例如 13800000000">
                </div>
              </div>
              <div class="mt-4">
                <label class="block text-sm text-slate-600 mb-1">个性签名</label>
                <textarea id="bioInput" rows="4" class="soft-input w-full px-4 py-2 rounded-lg focus:outline-none" placeholder="写一句你的文化宣言"></textarea>
              </div>
              <button id="saveProfileBtn" class="mt-5 px-6 py-2.5 bg-gradient-to-r from-red-600 to-amber-500 text-white rounded-lg font-semibold hover:from-red-700 hover:to-amber-600">
                <i class="fa fa-save mr-1"></i> 保存资料
              </button>
            </div>
            <div class="panel-card bg-white rounded-2xl p-6 md:p-8">
              <h2 class="text-xl font-semibold mb-4">账号安全</h2>
              <div class="grid md:grid-cols-3 gap-4">
                <div>
                  <label class="block text-sm text-slate-600 mb-1">原密码</label>
                  <input id="oldPasswordInput" type="password" class="soft-input w-full px-4 py-2 rounded-lg focus:outline-none">
                </div>
                <div>
                  <label class="block text-sm text-slate-600 mb-1">新密码</label>
                  <input id="newPasswordInput" type="password" class="soft-input w-full px-4 py-2 rounded-lg focus:outline-none">
                </div>
                <div>
                  <label class="block text-slate-600 mb-1">确认新密码</label>
                  <input id="confirmPasswordInput" type="password" class="soft-input w-full px-4 py-2 rounded-lg focus:outline-none">
                </div>
              </div>
              <label class="mt-3 inline-flex items-center gap-2 text-sm text-slate-600">
                <input id="showPasswordToggle" type="checkbox">
                显示密码输入内容
              </label>
              <button id="savePasswordBtn" class="mt-5 px-6 py-2.5 bg-slate-800 text-white rounded-lg font-semibold hover:bg-slate-900">
                <i class="fa fa-shield mr-1"></i> 更新密码
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 我的作品 -->
      <div id="works" class="tab-content">
        <div class="panel-card bg-white rounded-2xl p-6 md:p-8">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-semibold">我的作品</h2>
            <a href="designer.html" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 flex items-center gap-2">
              <i class="fa fa-plus"></i> 创作新作品
            </a>
          </div>

          <div id="workStats" class="grid grid-cols-2 gap-4 mb-6">
            <div class="rounded-xl bg-slate-50 p-4 text-center">
              <p id="totalWorks" class="text-2xl font-bold text-red-600">0</p>
              <p class="text-sm text-slate-500">总作品数</p>
            </div>
            <div class="rounded-xl bg-green-50 p-4 text-center">
              <p id="approvedWorks" class="text-2xl font-bold text-green-600">0</p>
              <p class="text-sm text-slate-500">已发布</p>
            </div>
          </div>
          <ul id="workList" class="space-y-3 text-sm"></ul>
        </div>
      </div>

      <!-- 我的收藏 -->
      <div id="favorites" class="tab-content">
        <div class="grid lg:grid-cols-2 gap-6">
          <div class="panel-card bg-white rounded-2xl p-6 md:p-8">
            <h2 class="text-xl font-semibold mb-4">邦典样式收藏</h2>
            <ul id="favoriteBondiansList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></ul>
          </div>
          <div class="panel-card bg-white rounded-2xl p-6 md:p-8">
            <h2 class="text-xl font-semibold mb-4">宣言收藏</h2>
            <ul id="declarationList" class="space-y-3 text-sm"></ul>
          </div>
        </div>
      </div>

      <!-- 最近浏览 -->
      <div id="history" class="tab-content">
        <div class="panel-card bg-white rounded-2xl p-6 md:p-8">
          <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-semibold">最近浏览</h2>
            <button id="clearHistoryBtn" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200">
              <i class="fa fa-trash mr-1"></i> 清空记录
            </button>
          </div>
          <ul id="recentVisitList" class="space-y-2 text-sm"></ul>
        </div>
      </div>

      <!-- 账号设置 -->
      <div id="settings" class="tab-content">
        <div class="panel-card bg-white rounded-2xl p-6 md:p-8">
          <h2 class="text-xl font-semibold mb-6">账号操作</h2>
          <div class="space-y-4">
            <button id="deleteAccountBtn" class="w-full px-5 py-3 rounded-lg bg-red-50 text-red-700 hover:bg-red-100 flex items-center justify-between">
              <span><i class="fa fa-trash mr-2"></i> 注销账号</span>
              <span class="text-sm text-gray-400">账号数据将被清空</span>
            </button>
            <button id="exportDataBtn" class="w-full px-5 py-3 rounded-lg bg-slate-50 text-slate-700 hover:bg-slate-100 flex items-center justify-between">
              <span><i class="fa fa-download mr-2"></i> 导出个人数据</span>
              <span class="text-sm text-gray-400">包括作品、收藏等</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function getApiBaseUrl() {
      if (typeof window !== 'undefined') {
        const hostname = window.location.hostname;
        if (hostname === 'localhost' || hostname === '127.0.0.1') {
          return 'http://localhost:3000/api';
        }
        return '/api';
      }
      return 'http://localhost:3000/api';
    }

    const API_BASE_URL = getApiBaseUrl();

    function getToken() {
      return localStorage.getItem('token');
    }

    function getCurrentUser() {
      const userRaw = localStorage.getItem('user');
      if (!userRaw) return null;
      try {
        return JSON.parse(userRaw);
      } catch (error) {
        return null;
      }
    }

    function saveCurrentUser(user) {
      localStorage.setItem('user', JSON.stringify(user));
    }

    async function requestApi(path, options = {}) {
      const token = getToken();
      const headers = {
        'Content-Type': 'application/json',
        ...(options.headers || {})
      };

      if (token) {
        headers.Authorization = `Bearer ${token}`;
      }

      const response = await fetch(`${API_BASE_URL}${path}`, {
        ...options,
        headers
      });

      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.message || '请求失败');
      }
      return data;
    }

    function getProfileRate(user) {
      let score = 0;
      if (user.username) score += 40;
      if (user.phone) score += 30;
      if (user.bio) score += 30;
      return score;
    }

    function refreshUserCard(user) {
      const first = (user.username || '用').charAt(0);
      const avatarImage = document.getElementById('avatarImage');
      const avatarText = document.getElementById('avatarText');
      if (user.avatarUrl) {
        avatarImage.src = user.avatarUrl;
        avatarImage.classList.remove('hidden');
        avatarText.classList.add('hidden');
      } else {
        avatarImage.classList.add('hidden');
        avatarText.classList.remove('hidden');
        avatarText.textContent = first;
      }
      document.getElementById('welcomeName').textContent = user.username || '用户';
      document.getElementById('cardUsername').textContent = user.username || '-';
      document.getElementById('cardPhone').textContent = user.phone || '未填写手机号';
      document.getElementById('cardBio').textContent = user.bio || '这个人很酷，还没写签名。';
      document.getElementById('cardType').textContent = user.type === 'admin' ? '管理员' : '普通用户';
      document.getElementById('profileRate').textContent = getProfileRate(user) + '%';
      document.getElementById('createdAt').textContent = user.createdAt || '-';
      document.getElementById('miniAvatar').textContent = first;
      document.getElementById('miniUsername').textContent = user.username || '用户';
    }

    function renderWorks(works) {
      const list = document.getElementById('workList');
      const totalWorks = document.getElementById('totalWorks');
      const approvedWorks = document.getElementById('approvedWorks');

      totalWorks.textContent = works.length;
      approvedWorks.textContent = works.length;

      if (!works.length) {
        list.innerHTML = '<li class="text-slate-500 text-center py-8">暂无作品记录，先在设计工坊中创作并保存你的设计吧。</li>';
        return;
      }

      list.innerHTML = works.map((item) => {
        const createdTime = item.createdAt ? new Date(item.createdAt).toLocaleString('zh-CN') : '-';
        
        let colorPreview = '';
        if (item.colors && Array.isArray(item.colors)) {
          colorPreview = `<div class="flex h-8 rounded-lg overflow-hidden">${item.colors.map(c => `<div class="flex-1" style="background: ${c.hex || c}"></div>`).join('')}</div>`;
        }

        return `<li class="rounded-lg border border-slate-200 overflow-hidden hover:shadow-md transition-shadow">
          <div class="flex">
            ${colorPreview}
            <div class="flex-1 p-3 min-w-0">
              <div class="flex items-start justify-between gap-3">
                <div>
                  <p class="font-medium">${item.title}</p>
                  <p class="text-xs text-slate-500">${createdTime}</p>
                </div>
                <span class="px-2 py-1 rounded-full text-xs bg-green-100 text-green-700">已保存</span>
              </div>
              <p class="text-sm text-slate-600 mt-2 line-clamp-2">${item.description || '暂无描述'}</p>
            </div>
          </div>
        </li>`;
      }).join('');
    }

    function formatTime(dateStr) {
      if (!dateStr) return '-';
      try {
        // 确保正确解析UTC时间
        const date = new Date(dateStr);
        if (isNaN(date.getTime())) return '-';
        
        // 显示具体的访问时间（本地时间格式）
        return date.toLocaleString('zh-CN', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        });
      } catch (error) {
        return '-';
      }
    }

    async function loadHistory() {
      const list = document.getElementById('recentVisitList');
      try {
        const result = await requestApi('/user/history');
        const history = result.data || [];
        
        if (!history.length) {
          list.innerHTML = '<li class="text-slate-500 text-center py-8">暂无浏览记录。</li>';
          return;
        }

        list.innerHTML = history.map((item) => {
          const time = formatTime(item.createdAt);
          return `<li class="rounded-lg border border-slate-200 px-4 py-3 flex items-center justify-between">
            <span>${item.title || '未知页面'}</span>
            <span class="text-xs text-slate-500">${time}</span>
          </li>`;
        }).join('');
      } catch (error) {
        console.error('加载浏览记录失败:', error);
        list.innerHTML = '<li class="text-slate-500">加载浏览记录失败。</li>';
      }
    }

    function renderFavoriteBondians(favorites) {
      const list = document.getElementById('favoriteBondiansList');
      if (!favorites || !favorites.length) {
        list.innerHTML = '<li class="col-span-full text-slate-500 text-center py-8">暂无收藏的邦典或色卡，可在设计工坊或邦典图鉴中收藏。</li>';
        return;
      }

      list.innerHTML = favorites.map((item) => {
        const imageUrl = item.imageUrl || item.image_url || '';
        const displayName = item.name || item.region || '邦典';
        const isBase64 = imageUrl && imageUrl.startsWith('data:image/');
        const isRelativePath = imageUrl && !isBase64 && imageUrl.includes('/');
        return `<li class="rounded-xl border border-slate-200 overflow-hidden hover:shadow-md transition-shadow">
          <div class="relative">
            ${isBase64 ? `<img src="${imageUrl}" alt="${displayName}" class="w-full h-32 object-cover" onerror="this.src='https://via.placeholder.com/200x200?text=邦典'">` : isRelativePath ? `<img src="${imageUrl}" alt="${displayName}" class="w-full h-32 object-cover" onerror="this.src='https://via.placeholder.com/200x200?text=邦典'">` : `<div class="w-full h-32 bg-gradient-to-br from-gray-100 to-gray-200 flex items-center justify-center"><i class="fa fa-image text-gray-400 text-3xl"></i></div>`}
            <button data-id="${item.id}" class="remove-favorite-btn absolute top-2 right-2 w-8 h-8 bg-white/90 rounded-full flex items-center justify-center text-red-500 hover:bg-red-500 hover:text-white transition-colors">
              <i class="fa fa-heart"></i>
            </button>
          </div>
          <div class="p-3">
            <p class="font-medium text-slate-800 truncate">${displayName}</p>
            <p class="text-xs text-slate-500">${item.type === 'pattern' ? '色卡' : '邦典图片'}</p>
            <p class="text-xs text-slate-400 mt-1">收藏于 ${item.createdAt ? new Date(item.createdAt).toLocaleDateString('zh-CN') : '-'}</p>
          </div>
        </li>`;
      }).join('');
    }

    function renderDeclarations(declarations) {
      const list = document.getElementById('declarationList');
      
      if (!declarations || !declarations.length) {
        list.innerHTML = '<li class="text-slate-500 text-center py-8">暂无收藏宣言，可在设计工坊中收藏。</li>';
        return;
      }

      list.innerHTML = declarations.map((item) => {
        const colorText = item.colors && Array.isArray(item.colors) && item.colors.length 
          ? item.colors.join(' / ') 
          : '未标注配色';
        const time = item.createdAt ? new Date(item.createdAt).toLocaleString('zh-CN') : '-';
        
        return `<li class="rounded-lg border border-slate-200 px-4 py-3">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <p class="text-slate-700">${item.declarationText || item.content}</p>
              <p class="text-xs text-slate-500 mt-2">${colorText} · ${time}</p>
            </div>
            <button data-id="${item.id}" class="delete-declaration-btn text-red-600 hover:text-red-700 flex-shrink-0">
              <i class="fa fa-trash"></i>
            </button>
          </div>
        </li>`;
      }).join('');
    }

    async function initUserCenter() {
      const token = getToken();
      if (!token) {
        document.getElementById('centerPanel').classList.add('hidden');
        document.getElementById('notLogin').classList.remove('hidden');
        return;
      }

      let currentUser = getCurrentUser() || {};

      try {
        const profileRes = await requestApi('/auth/me');
        currentUser = {
          ...currentUser,
          id: profileRes.user.id,
          username: profileRes.user.username,
          type: profileRes.user.role,
          createdAt: currentUser.createdAt || new Date().toLocaleString('zh-CN')
        };
        saveCurrentUser(currentUser);
      } catch (error) {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        document.getElementById('centerPanel').classList.add('hidden');
        document.getElementById('notLogin').classList.remove('hidden');
        alert('登录状态已失效，请重新登录');
        return;
      }

      document.getElementById('notLogin').classList.add('hidden');
      document.getElementById('centerPanel').classList.remove('hidden');

      document.getElementById('usernameInput').value = currentUser.username || '';
      document.getElementById('phoneInput').value = currentUser.phone || '';
      document.getElementById('bioInput').value = currentUser.bio || '';
      refreshUserCard(currentUser);

      function refreshMyWorks() {
        // 从 localStorage 读取保存的设计
        const savedDesigns = JSON.parse(localStorage.getItem('savedDesigns') || '[]');
        renderWorks(savedDesigns);
      }

      function loadUserFavorites() {
        // 从 localStorage 读取收藏
        const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
        // 筛选邦典图片和色卡收藏
        const bondianFavorites = favorites.filter(f => f.type === 'bangdian_image' || f.type === 'pattern');
        renderFavoriteBondians(bondianFavorites);
        
        // 渲染宣言收藏
        const declarations = favorites.filter(f => f.type === 'declaration');
        renderDeclarations(declarations);
      }

      refreshMyWorks();
      loadUserFavorites();
      await loadHistory();

      // 返回按钮
      document.getElementById('backBtn').addEventListener('click', () => {
        window.history.back();
      });

      // 侧边栏导航切换
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const tab = btn.getAttribute('data-tab');
          
          document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          
          document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
          document.getElementById(tab).classList.add('active');
          
          document.getElementById('pageTitle').textContent = {
            profile: '个人资料',
            works: '我的作品',
            favorites: '我的收藏',
            history: '最近浏览',
            settings: '账号设置'
          }[tab];
        });
      });

      // 上传头像
      document.getElementById('uploadAvatarBtn').addEventListener('click', () => {
        document.getElementById('avatarUploadInput').click();
      });

      document.getElementById('avatarUploadInput').addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          alert('请上传图片文件');
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          currentUser.avatarUrl = reader.result;
          saveCurrentUser(currentUser);
          refreshUserCard(currentUser);
          alert('头像已更新');
        };
        reader.readAsDataURL(file);
      });

      // 保存资料
      document.getElementById('saveProfileBtn').addEventListener('click', async () => {
        const username = document.getElementById('usernameInput').value.trim();
        const phone = document.getElementById('phoneInput').value.trim();
        const bio = document.getElementById('bioInput').value.trim();

        if (!username) {
          alert('用户名不能为空');
          return;
        }
        if (phone && !/^1[3-9]\d{9}$/.test(phone)) {
          alert('手机号格式不正确');
          return;
        }

        try {
          await requestApi('/auth/profile', {
            method: 'PUT',
            body: JSON.stringify({ username, phone, bio })
          });
          currentUser.username = username;
          currentUser.phone = phone;
          currentUser.bio = bio;
          saveCurrentUser(currentUser);
          refreshUserCard(currentUser);
          alert('资料保存成功');
        } catch (error) {
          alert(`保存失败：${error.message}`);
        }
      });

      // 密码显示切换
      document.getElementById('showPasswordToggle').addEventListener('change', (event) => {
        const type = event.target.checked ? 'text' : 'password';
        document.getElementById('oldPasswordInput').type = type;
        document.getElementById('newPasswordInput').type = type;
        document.getElementById('confirmPasswordInput').type = type;
      });

      // 修改密码
      document.getElementById('savePasswordBtn').addEventListener('click', async () => {
        const oldPassword = document.getElementById('oldPasswordInput').value;
        const newPassword = document.getElementById('newPasswordInput').value;
        const confirmPassword = document.getElementById('confirmPasswordInput').value;

        if (!oldPassword || !newPassword || !confirmPassword) {
          alert('请填写完整密码信息');
          return;
        }
        if (newPassword !== confirmPassword) {
          alert('新密码和确认密码不一致');
          return;
        }
        if (newPassword.length < 6) {
          alert('新密码长度不能少于6位');
          return;
        }

        try {
          await requestApi('/auth/password', {
            method: 'PUT',
            body: JSON.stringify({ oldPassword, newPassword })
          });
          document.getElementById('oldPasswordInput').value = '';
          document.getElementById('newPasswordInput').value = '';
          document.getElementById('confirmPasswordInput').value = '';
          alert('密码修改成功，请重新登录');
          localStorage.removeItem('token');
          localStorage.removeItem('user');
          window.location.href = 'index.html';
        } catch (error) {
          alert(`修改失败：${error.message}`);
        }
      });

      // 取消收藏邦典
      document.getElementById('favoriteBondiansList').addEventListener('click', (event) => {
        const target = event.target.closest('.remove-favorite-btn');
        if (!target) return;
        const itemId = parseInt(target.getAttribute('data-id'));
        
        let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
        favorites = favorites.filter(f => f.id !== itemId);
        localStorage.setItem('favorites', JSON.stringify(favorites));
        
        loadUserFavorites();
        alert('取消收藏成功');
      });

      // 删除收藏的宣言
      document.getElementById('declarationList').addEventListener('click', (event) => {
        const target = event.target.closest('.delete-declaration-btn');
        if (!target) return;
        const itemId = parseInt(target.getAttribute('data-id'));
        
        let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
        favorites = favorites.filter(f => f.id !== itemId);
        localStorage.setItem('favorites', JSON.stringify(favorites));
        
        loadUserFavorites();
        alert('删除成功');
      });

      // 清空浏览记录
      document.getElementById('clearHistoryBtn').addEventListener('click', async () => {
        if (!confirm('确认清空所有浏览记录？')) return;
        
        try {
          await requestApi('/user/history', { method: 'DELETE' });
          await loadHistory();
          alert('浏览记录已清空');
        } catch (error) {
          alert(`清空失败：${error.message}`);
        }
      });

      // 导出数据
      document.getElementById('exportDataBtn').addEventListener('click', () => {
        alert('数据导出功能正在开发中');
      });

      // 退出登录
      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        alert('已退出登录');
        window.location.href = 'index.html';
      });

      document.getElementById('logoutBtnTop').addEventListener('click', () => {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        alert('已退出登录');
        window.location.href = 'index.html';
      });

      // 注销账号
      document.getElementById('deleteAccountBtn').addEventListener('click', async () => {
        const ok = confirm('确认注销当前账号？所有数据将被清空，且不可恢复。');
        if (!ok) return;
        
        try {
          await requestApi('/auth/delete', {
            method: 'DELETE'
          });
          localStorage.removeItem('token');
          localStorage.removeItem('user');
          alert('账号已注销');
          window.location.href = 'index.html';
        } catch (error) {
          alert(`注销失败：${error.message}`);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', initUserCenter);
  </script>
</body>
</html>
