<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品广场 - 邦典·藏族文化数字平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans SC', sans-serif; background: #F8F4ED; }
    .nav-header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
      background: rgba(248, 244, 237, 0.95); backdrop-filter: blur(20px);
      padding: 1rem 2rem; box-shadow: 0 4px 30px rgba(0,0,0,0.08);
    }
    .nav-link { color: #2C2C2C; font-weight: 500; margin: 0 1rem; text-decoration: none; }
    .nav-link.active { color: #9E2A2F; font-weight: 600; }
    .card-hover { transition: transform 0.2s; }
    .card-hover:hover { transform: translateY(-5px); }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
    .modal-content { background: white; border-radius: 1rem; max-width: 500px; width: 90%; padding: 1.5rem; }
  </style>
</head>
<body class="pt-20">
  <!-- 导航栏 -->
  <header class="nav-header">
    <div class="container mx-auto flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-yellow-400 to-red-600 flex items-center justify-center">
          <i class="fa fa-paint-brush text-white"></i>
        </div>
        <span class="font-bold text-xl" style="color: #9E2A2F;">邦典</span>
      </a>
      <nav>
        <a href="decode.html" class="nav-link">文化解码</a>
        <a href="experience.html" class="nav-link">沉浸式体验</a>
        <a href="gam.html" class="nav-link">人生历程</a>
        <a href="map.html" class="nav-link">数据可视化</a>
        <a href="gallery.html" class="nav-link active">作品广场</a>
      </nav>
      <div id="userInfo" class="hidden flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-red-600 to-amber-500 flex items-center justify-center text-white"><i class="fa fa-user"></i></div>
        <span id="userName" class="text-slate-700 font-medium"></span>
        <button id="logoutBtn" class="text-sm text-slate-600 hover:text-red-700">退出</button>
      </div>
      <button id="loginBtn" class="px-4 py-2 bg-gradient-to-r from-red-600 to-amber-500 text-white rounded-lg">登录</button>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8 max-w-7xl">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-red-700"><i class="fa fa-picture-o mr-3"></i>邦典作品广场</h1>
      <div class="flex gap-2">
        <button id="sortTimeBtn" class="px-3 py-1 bg-white rounded-full shadow text-sm">⏰ 最新</button>
        <button id="sortHotBtn" class="px-3 py-1 bg-white rounded-full shadow text-sm">🔥 最热</button>
      </div>
    </div>
    <div id="gallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <!-- 评论模态框 -->
  <div id="commentModal" class="modal">
    <div class="modal-content">
      <h3 class="text-xl font-bold text-red-700 mb-4">添加评论</h3>
      <textarea id="commentText" rows="3" class="w-full border rounded-lg p-2 mb-4" placeholder="写下你的想法..."></textarea>
      <div class="flex justify-end gap-2">
        <button id="closeModalBtn" class="px-4 py-2 bg-gray-200 rounded-lg">取消</button>
        <button id="submitCommentBtn" class="px-4 py-2 bg-red-600 text-white rounded-lg">提交</button>
      </div>
    </div>
  </div>

  <script>
    let currentWorkId = null;
    let currentSort = 'time'; // time / hot

    // 获取作品列表
    function getWorks() {
      return JSON.parse(localStorage.getItem('worksGallery') || '[]');
    }

    function saveWorks(works) {
      localStorage.setItem('worksGallery', JSON.stringify(works));
    }

    // 渲染广场
    function renderGallery() {
      let works = getWorks();
      if (currentSort === 'hot') {
        works.sort((a,b) => b.likes - a.likes);
      } else {
        works.sort((a,b) => b.id - a.id);
      }
      const container = document.getElementById('gallery');
      if (works.length === 0) {
        container.innerHTML = '<div class="col-span-full text-center text-gray-500 py-12">暂无作品，快去设计你的邦典并发布吧！</div>';
        return;
      }
      container.innerHTML = works.map(work => `
        <div class="bg-white rounded-xl shadow-lg overflow-hidden card-hover">
          <img src="${work.imageUrl}" class="w-full h-56 object-cover" alt="邦典作品">
          <div class="p-4">
            <div class="flex justify-between items-start">
              <div>
                <p class="font-bold text-red-700">${escapeHtml(work.username)}</p>
                <p class="text-xs text-gray-400">${work.time}</p>
              </div>
              <span class="px-2 py-1 bg-amber-100 text-amber-700 rounded-full text-xs">${work.colors.join(' / ')}</span>
            </div>
            <p class="text-gray-700 text-sm mt-2 italic">“${escapeHtml(work.declaration.substring(0, 100))}”</p>
            <div class="flex justify-between items-center mt-4">
              <div class="flex gap-4">
                <button onclick="likeWork(${work.id})" class="flex items-center gap-1 text-red-500 hover:text-red-700">
                  <i class="fa fa-heart"></i> <span id="likes-${work.id}">${work.likes}</span>
                </button>
                <button onclick="openCommentModal(${work.id})" class="flex items-center gap-1 text-blue-500 hover:text-blue-700">
                  <i class="fa fa-comment"></i> ${work.comments.length}
                </button>
              </div>
              <button onclick="shareWork(${work.id})" class="text-gray-400 hover:text-gray-600"><i class="fa fa-share-alt"></i></button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // 点赞
    window.likeWork = function(id) {
      const works = getWorks();
      const work = works.find(w => w.id === id);
      if (work) {
        work.likes++;
        saveWorks(works);
        const likesSpan = document.getElementById(`likes-${id}`);
        if (likesSpan) likesSpan.innerText = work.likes;
      }
    };

    // 打开评论模态框
    let activeWorkId = null;
    window.openCommentModal = function(id) {
      const user = localStorage.getItem('user');
      if (!user) { alert('请先登录'); return; }
      activeWorkId = id;
      document.getElementById('commentModal').style.display = 'flex';
    };

    document.getElementById('closeModalBtn').onclick = () => {
      document.getElementById('commentModal').style.display = 'none';
      document.getElementById('commentText').value = '';
    };
    document.getElementById('submitCommentBtn').onclick = () => {
      const text = document.getElementById('commentText').value.trim();
      if (!text) { alert('请输入评论内容'); return; }
      const user = JSON.parse(localStorage.getItem('user'));
      const works = getWorks();
      const work = works.find(w => w.id === activeWorkId);
      if (work) {
        work.comments.push({ username: user.username, text: text, time: new Date().toLocaleString() });
        saveWorks(works);
        alert('评论成功');
        document.getElementById('commentModal').style.display = 'none';
        document.getElementById('commentText').value = '';
        renderGallery(); // 刷新显示评论数
      }
    };

    window.shareWork = function(id) {
      alert('分享链接：' + window.location.href + '?work=' + id);
    };

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      });
    }

    // 排序
    document.getElementById('sortTimeBtn').onclick = () => { currentSort = 'time'; renderGallery(); };
    document.getElementById('sortHotBtn').onclick = () => { currentSort = 'hot'; renderGallery(); };

    // 登录状态检查
    function checkLogin() {
      const user = localStorage.getItem('user');
      if (user) {
        document.getElementById('userInfo').classList.remove('hidden');
        document.getElementById('loginBtn').classList.add('hidden');
        document.getElementById('userName').innerText = JSON.parse(user).username;
      } else {
        document.getElementById('userInfo').classList.add('hidden');
        document.getElementById('loginBtn').classList.remove('hidden');
      }
    }
    checkLogin();
    document.getElementById('loginBtn').onclick = () => alert('请前往首页或任意页面登录');
    document.getElementById('logoutBtn').onclick = () => { localStorage.removeItem('user'); checkLogin(); alert('已退出'); location.reload(); };

    renderGallery();
  </script>
</body>
</html>
