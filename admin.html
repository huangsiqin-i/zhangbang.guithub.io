<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 邦典文化平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
  <div class="container mx-auto p-6 max-w-6xl">
    <h1 class="text-3xl font-bold text-red-700 mb-6"><i class="fa fa-lock mr-3"></i>邦典管理后台</h1>
    <div id="adminPanel" class="bg-white rounded-xl shadow p-6">
      <div class="mb-6">
        <label class="block text-sm font-medium">管理员验证码</label>
        <div class="flex gap-2 mt-1">
          <input type="password" id="adminCode" class="border rounded-lg px-3 py-2 flex-1" placeholder="请输入管理员密码">
          <button id="verifyAdmin" class="px-4 py-2 bg-red-600 text-white rounded-lg">登录</button>
        </div>
        <p class="text-xs text-gray-500 mt-1">默认密码：admin123（演示用）</p>
      </div>

      <div id="adminContent" style="display: none;">
        <!-- 标签页 -->
        <div class="flex border-b mb-4">
          <button class="tab-btn active px-4 py-2 text-red-600 border-b-2 border-red-600" data-tab="works">作品管理</button>
          <button class="tab-btn px-4 py-2 text-gray-600" data-tab="workshops">工坊管理</button>
          <button class="tab-btn px-4 py-2 text-gray-600" data-tab="stats">数据统计</button>
        </div>

        <!-- 作品管理 -->
        <div id="tab-works" class="tab-content">
          <div class="overflow-x-auto">
            <table class="min-w-full bg-white">
              <thead class="bg-gray-100">
                <tr><th class="px-4 py-2">ID</th><th>作者</th><th>图片</th><th>宣言</th><th>点赞</th><th>操作</th></tr>
              </thead>
              <tbody id="worksTable"></tbody>
            </table>
          </div>
        </div>

        <!-- 工坊管理 -->
        <div id="tab-workshops" class="tab-content hidden">
          <div id="workshopList" class="space-y-4"></div>
          <button id="addWorkshopBtn" class="mt-4 px-4 py-2 bg-green-600 text-white rounded-lg">+ 添加工坊</button>
        </div>

        <!-- 数据统计 -->
        <div id="tab-stats" class="tab-content hidden">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-blue-50 p-4 rounded-lg"><h3 class="font-bold">总作品数</h3><p id="totalWorks" class="text-2xl">0</p></div>
            <div class="bg-green-50 p-4 rounded-lg"><h3 class="font-bold">总用户数</h3><p id="totalUsers" class="text-2xl">0</p></div>
            <div class="bg-purple-50 p-4 rounded-lg"><h3 class="font-bold">总评论数</h3><p id="totalComments" class="text-2xl">0</p></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 模拟管理员密码
    const ADMIN_PASSWORD = "admin123";

    document.getElementById('verifyAdmin').onclick = () => {
      const pwd = document.getElementById('adminCode').value;
      if (pwd === ADMIN_PASSWORD) {
        document.getElementById('adminContent').style.display = 'block';
        document.getElementById('verifyAdmin').disabled = true;
        loadWorks();
        loadWorkshops();
        loadStats();
      } else {
        alert('密码错误');
      }
    };

    // 获取作品数据
    function getWorks() { return JSON.parse(localStorage.getItem('worksGallery') || '[]'); }
    function saveWorks(works) { localStorage.setItem('worksGallery', JSON.stringify(works)); }

    function loadWorks() {
      const works = getWorks();
      const tbody = document.getElementById('worksTable');
      tbody.innerHTML = works.map(w => `
        <tr class="border-b">
          <td class="px-4 py-2">${w.id}</td>
          <td class="px-4 py-2">${escapeHtml(w.username)}</td>
          <td class="px-4 py-2"><img src="${w.imageUrl}" class="w-16 h-16 object-cover rounded"></td>
          <td class="px-4 py-2 max-w-xs truncate">${escapeHtml(w.declaration)}</td>
          <td class="px-4 py-2">${w.likes}</td>
          <td class="px-4 py-2"><button onclick="deleteWork(${w.id})" class="text-red-600 hover:text-red-800">删除</button></td>
        </tr>
      `).join('');
    }

    window.deleteWork = function(id) {
      if (confirm('确定删除该作品吗？')) {
        let works = getWorks();
        works = works.filter(w => w.id !== id);
        saveWorks(works);
        loadWorks();
        loadStats();
      }
    };

    // 工坊管理（模拟数据，存储在localStorage）
    function getWorkshops() { return JSON.parse(localStorage.getItem('workshops') || '[]'); }
    function saveWorkshops(ws) { localStorage.setItem('workshops', JSON.stringify(ws)); }

    function loadWorkshops() {
      let workshops = getWorkshops();
      if (workshops.length === 0) {
        // 初始化默认工坊
        workshops = [
          { id: 1, name: '拉萨八廓街雪域工坊', address: '拉萨市八廓街', contact: '0891-123456' },
          { id: 2, name: '日喀则高原巧手工坊', address: '日喀则市', contact: '0892-654321' }
        ];
        saveWorkshops(workshops);
      }
      const container = document.getElementById('workshopList');
      container.innerHTML = workshops.map(w => `
        <div class="border p-4 rounded-lg flex justify-between items-center">
          <div><strong>${escapeHtml(w.name)}</strong><br><span class="text-sm text-gray-500">${w.address} | ${w.contact}</span></div>
          <button onclick="deleteWorkshop(${w.id})" class="text-red-500">删除</button>
        </div>
      `).join('');
    }

    window.deleteWorkshop = function(id) {
      let ws = getWorkshops();
      ws = ws.filter(w => w.id !== id);
      saveWorkshops(ws);
      loadWorkshops();
    };

    document.getElementById('addWorkshopBtn').onclick = () => {
      const name = prompt('工坊名称');
      const address = prompt('地址');
      const contact = prompt('联系方式');
      if (name && address) {
        let ws = getWorkshops();
        const newId = Date.now();
        ws.push({ id: newId, name, address, contact });
        saveWorkshops(ws);
        loadWorkshops();
      }
    };

    function loadStats() {
      const works = getWorks();
      document.getElementById('totalWorks').innerText = works.length;
      // 模拟用户数（从作品作者去重 + localStorage中的user）
      const users = new Set(works.map(w => w.username));
      const localUser = localStorage.getItem('user');
      if (localUser) users.add(JSON.parse(localUser).username);
      document.getElementById('totalUsers').innerText = users.size;
      const totalComments = works.reduce((sum, w) => sum + (w.comments?.length || 0), 0);
      document.getElementById('totalComments').innerText = totalComments;
    }

    // Tab切换
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active', 'text-red-600', 'border-red-600'));
        btn.classList.add('active', 'text-red-600', 'border-red-600');
        const tab = btn.dataset.tab;
        document.querySelectorAll('.tab-content').forEach(div => div.classList.add('hidden'));
        document.getElementById(`tab-${tab}`).classList.remove('hidden');
        if (tab === 'stats') loadStats();
      };
    });

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
  </script>
</body>
</html>
